<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebXR Hello World</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
      color: white;
    }

    #app { width: 100%; height: 100%; }

    #overlay {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 20;
      background: rgba(0,0,0,0.72);
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.45;
      max-width: 420px;
      font-size: 14px;
    }

    #status {
      margin-top: 8px;
      white-space: pre-wrap;
      font-size: 13px;
      color: #cbd5e1;
    }

    #enterVrBtn {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 30;
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    #enterVrBtn[disabled] { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="overlay">
    <div><strong>WebXR demo</strong></div>
    <div>Hello World + квадрат + куб + захват предметов</div>
    <div style="margin-top:6px">Открывать в <b>Meta Quest Browser</b></div>
    <div style="margin-top:6px">Подойдите к кубу/квадрату и нажмите trigger/squeeze, чтобы взять.</div>
    <div style="margin-top:6px">Теперь отображаются лучи, контроллеры и (если доступно) руки.</div>
    <div id="status">Проверка WebXR...</div>
  </div>

  <button id="enterVrBtn" disabled>Enter VR</button>
  <div id="app"></div>

  <script type="module">
    // ВАЖНО: используем версию three со встроенными зависимостями
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { XRControllerModelFactory } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/XRControllerModelFactory.js';
    import { XRHandModelFactory } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/XRHandModelFactory.js';

    const statusEl = document.getElementById('status');
    const enterVrBtn = document.getElementById('enterVrBtn');

    const setStatus = (t) => statusEl.textContent = Array.isArray(t) ? t.join('\n') : t;

    // ---------- SCENE ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x20242b);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.6, 2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.getElementById('app').appendChild(renderer.domElement);

    // ---------- LIGHT ----------
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.4));
    const dl = new THREE.DirectionalLight(0xffffff, 1.1);
    dl.position.set(2,4,3);
    scene.add(dl);

    // ---------- FLOOR ----------
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(8,8),
      new THREE.MeshStandardMaterial({ color:0x30343b })
    );
    floor.rotation.x = -Math.PI/2;
    scene.add(floor);

    // ---------- TEXT ----------
    function makeText(text){
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 256;
      const g = c.getContext('2d');
      g.fillStyle='#111827'; g.fillRect(0,0,c.width,c.height);
      g.fillStyle='white'; g.font='bold 110px Arial';
      g.textAlign='center'; g.textBaseline='middle';
      g.fillText(text, c.width/2, c.height/2);
      const tex = new THREE.CanvasTexture(c);
      return new THREE.Mesh(
        new THREE.PlaneGeometry(1.8,.45),
        new THREE.MeshBasicMaterial({ map:tex })
      );
    }

    const hello = makeText('Hello World');
    hello.position.set(0,1.8,-1.5);
    scene.add(hello);

    // ---------- SHAPES ----------
    const square = new THREE.Mesh(
      new THREE.PlaneGeometry(.45,.45),
      new THREE.MeshStandardMaterial({ color:0x4ade80, side:THREE.DoubleSide })
    );
    square.position.set(-.7,1.45,-1.5);
    scene.add(square);

    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(.35,.35,.35),
      new THREE.MeshStandardMaterial({ color:0xf97316 })
    );
    cube.position.set(.7,1.45,-1.5);
    scene.add(cube);

    const grabbables = [cube, square];

    // ---------- CONTROLLERS / HANDS ----------
    const controllerModelFactory = new XRControllerModelFactory();
    const handModelFactory = new XRHandModelFactory();

    function makeControllerRay(){
      const points = [new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-1)];
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const material = new THREE.LineBasicMaterial({ color: 0x93c5fd });
      const ray = new THREE.Line(geometry, material);
      ray.name = 'ray';
      ray.scale.z = 1.2;
      return ray;
    }

    function setupController(index){
      const controller = renderer.xr.getController(index);
      controller.userData.inputSource = null;
      controller.add(makeControllerRay());
      controller.addEventListener('connected', (event) => {
        controller.userData.inputSource = event.data;
      });
      controller.addEventListener('disconnected', () => {
        controller.userData.inputSource = null;
      });

      const grip = renderer.xr.getControllerGrip(index);
      grip.add(controllerModelFactory.createControllerModel(grip));

      const hand = renderer.xr.getHand(index);
      hand.add(handModelFactory.createHandModel(hand, 'mesh'));

      return { controller, grip, hand };
    }

    const xr0 = setupController(0);
    const xr1 = setupController(1);

    // ---------- GRAB ----------
    const controller0 = xr0.controller;
    const controller1 = xr1.controller;
    const grabState = [
      { heldObject: null, wasPressed: false },
      { heldObject: null, wasPressed: false }
    ];
    const MAX_GRAB_DISTANCE = 0.35;
    const tempControllerPos = new THREE.Vector3();
    const tempObjectPos = new THREE.Vector3();

    function isGrabPressed(source){
      if(!source?.gamepad?.buttons) return false;

      // Поддержка разных схем: trigger, squeeze и fallback на первый доступный action-кнопки.
      const buttons = source.gamepad.buttons;
      const candidateIndexes = [0, 1, 4, 5];
      for(const index of candidateIndexes){
        const button = buttons[index];
        if(button && (button.pressed || button.value > 0.65)) return true;
      }

      return false;
    }

    function findClosestGrabbable(controller){
      controller.getWorldPosition(tempControllerPos);

      let closest = null;
      let minDistance = Infinity;

      for(const object of grabbables){
        object.getWorldPosition(tempObjectPos);
        const distance = tempControllerPos.distanceTo(tempObjectPos);

        if(distance < MAX_GRAB_DISTANCE && distance < minDistance){
          closest = object;
          minDistance = distance;
        }
      }

      return closest;
    }

    function tryToggleGrab(controller, state, source){
      const pressed = isGrabPressed(source);

      if(pressed && !state.wasPressed){
        if(state.heldObject){
          state.heldObject.material.emissive?.setHex(0x000000);
          scene.attach(state.heldObject);
          state.heldObject = null;
        } else {
          const target = findClosestGrabbable(controller);
          if(target){
            target.material.emissive?.setHex(0x1f2937);
            controller.attach(target);
            state.heldObject = target;
          }
        }
      }

      state.wasPressed = pressed;
    }

    // ---------- MOVEMENT / LOCOMOTION ----------
    // Простое движение стиком контроллера (smooth locomotion)

    const player = new THREE.Group();
    player.position.set(0,0,0);
    player.add(camera);
    scene.add(player);

    // Добавляем контроллеры/модели в группу игрока, чтобы они перемещались вместе с ним
    player.add(controller0);
    player.add(controller1);
    player.add(xr0.grip);
    player.add(xr1.grip);
    player.add(xr0.hand);
    player.add(xr1.hand);

    const tempMatrix = new THREE.Matrix4();
    const velocity = new THREE.Vector3();

    function handleController(controller, source, dt){
      const session = renderer.xr.getSession();
      if(!session) return;

      if(!source?.gamepad) return;

      const axes = source.gamepad.axes;
      if(axes.length < 2) return;

      const x = axes[2] ?? axes[0];
      const y = axes[3] ?? axes[1];

      const dead = 0.15;
      const speed = 2.0;

      if(Math.abs(x) < dead && Math.abs(y) < dead) return;

      tempMatrix.identity().extractRotation(controller.matrixWorld);

      const dir = new THREE.Vector3(x, 0, y);
      dir.applyMatrix4(tempMatrix);
      dir.y = 0;
      dir.normalize();

      velocity.addScaledVector(dir, speed * dt);
    }

    // ---------- XR CHECK ----------
    async function checkXR(){
      const lines=[];
      lines.push('secureContext: '+isSecureContext);
      lines.push('in iframe: '+(window.top !== window.self));

      if(!navigator.xr){
        lines.push('navigator.xr: NO');
        lines.push('Открой страницу по https или localhost');
        lines.push('Именно в Meta Quest Browser');
        setStatus(lines);
        return;
      }

      lines.push('navigator.xr: YES');

      try {
        const ok = await navigator.xr.isSessionSupported('immersive-vr');
        lines.push('immersive-vr supported: '+ok);

        if(ok){
          enterVrBtn.disabled=false;
        }
      } catch (error) {
        lines.push('XR check error: '+ String(error));
        lines.push('Причина: WebXR запрещён текущей permissions policy.');
        lines.push('Обычно это значит, что страница открыта внутри iframe / preview,');
        lines.push('или сервер не разрешает xr-spatial-tracking.');
        lines.push('Решение: открыть прямой URL страницы, не в preview,');
        lines.push('в Meta Quest Browser по https или localhost.');
      }

      setStatus(lines);
    }

    // ---------- ENTER VR ----------
    enterVrBtn.onclick = async ()=>{
      try{
        const session = await navigator.xr.requestSession('immersive-vr',{
          optionalFeatures:['local-floor','bounded-floor','hand-tracking']
        });
        renderer.xr.setReferenceSpaceType('local-floor');
        await renderer.xr.setSession(session);
      }catch(e){
        setStatus([
          'requestSession error: ' + String(e),
          'Если тут mention permissions policy / disallowed,',
          'значит страницу нужно открыть как отдельный URL, а не внутри iframe/preview.'
        ]);
      }
    };

    // ---------- LOOP ----------
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = clock.getDelta();
      const t = clock.elapsedTime;

      cube.rotation.x = t * .8;
      cube.rotation.y = t * 1.1;
      square.rotation.z = Math.sin(t * 1.5) * .35;
      hello.position.y = 1.8 + Math.sin(t * 1.2) * .03;

      const session = renderer.xr.getSession();
      if(session){
        const source0 = controller0.userData.inputSource;
        const source1 = controller1.userData.inputSource;

        handleController(controller0, source0, dt);
        tryToggleGrab(controller0, grabState[0], source0);
        tryToggleGrab(controller1, grabState[1], source1);
      }

      player.position.add(velocity);
      velocity.multiplyScalar(0.85);

      renderer.render(scene, camera);
    });

    addEventListener('resize',()=>{
      camera.aspect=innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });

    checkXR();
  </script>
</body>
</html>
